<section class="stack section" id="stack" aria-labelledby="stack-title">
  <div class="container">
    <header class="head">
      <h2 id="stack-title">{{ title }}</h2>
      <p class="meta">Tecnologías que uso a diario. Sin porcentajes: logos y enlaces.</p>

      <div class="filters" role="tablist" aria-label="Filtrar por categoría">
        @for (cat of categories; track cat) {
          <button
            type="button"
            class="chip"
            role="tab"
            [attr.aria-selected]="isActive(cat)"
            [class.active]="isActive(cat)"
            (click)="setFilter(cat)"
          >
            {{ cat }}
          </button>
        }
      </div>
    </header>

    <div class="logo-grid" role="list">
      @for (it of visible; track trackByName($index, it)) {
        <a
          class="tile"
          role="listitem"
          [href]="it.url || null"
          target="_blank" rel="noopener"
          [class.size-s]="it.size === 's'"
          [class.size-m]="it.size === 'm'"
          [class.size-l]="it.size === 'l'"
          [attr.title]="it.note || it.name"
          [attr.data-cat]="it.category"
          [class.is-link]="!!it.url"
        >
          <div class="plate">
            @if (it.src) {
              <img [src]="it.src" [alt]="it.name" loading="lazy" decoding="async" />
            } @else {
              <i class="bi" [ngClass]="it.icon" aria-hidden="true"></i>
            }
          </div>
          <span class="label">{{ it.name }}</span>
        </a>
      }
    </div>
  </div>
</section>
